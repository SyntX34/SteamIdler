name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cli:
    name: Build CLI (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            ext: .exe
          - os: ubuntu-latest
            rid: linux-x64
            ext: ""
          - os: macos-latest
            rid: osx-x64
            ext: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        working-directory: SteamIdler
        run: dotnet restore SteamIdler.sln

      - name: Publish CLI
        working-directory: SteamIdler
        shell: bash
        run: |
          dotnet publish CLI/SteamIdler.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -o ../publish/CLI/${{ matrix.rid }}

      - name: Rename output
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          SRC="publish/CLI/${{ matrix.rid }}/SteamIdler${{ matrix.ext }}"
          DST="publish/CLI/${{ matrix.rid }}/SteamIdler-CLI-${TAG}-${{ matrix.rid }}${{ matrix.ext }}"
          mv "$SRC" "$DST"

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.rid }}
          path: publish/CLI/${{ matrix.rid }}/SteamIdler-CLI-*

  build-gui:
    name: Build GUI (win-x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        working-directory: SteamIdler
        run: dotnet restore SteamIdler.sln

      - name: Publish GUI
        working-directory: SteamIdler
        run: |
          dotnet publish GUI/SteamIdlerGUI.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o ..\publish\GUI

      - name: Rename output
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Rename-Item "publish\GUI\SteamIdlerGUI.exe" "SteamIdler-GUI-$tag-win-x64.exe"

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: gui-win-x64
          path: publish\GUI\SteamIdler-GUI-*

  release:
    name: Create Release
    needs: [build-cli, build-gui]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Steam Idler ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          body: |
            ## Steam Idler ${{ github.ref_name }}

            | File | Platform | Description |
            |------|----------|-------------|
            | `SteamIdler-CLI-*-win-x64.exe` | Windows | Console version |
            | `SteamIdler-CLI-*-linux-x64`   | Linux   | Console version |
            | `SteamIdler-CLI-*-osx-x64`     | macOS   | Console version |
            | `SteamIdler-GUI-*-win-x64.exe` | Windows | WinForms GUI    |

            - All files are **self-contained** — no .NET install needed
            - GUI is Windows-only (WinForms); CLI runs on Windows, Linux, and macOS

            **First run:**
            1. Run the exe — it creates `config.json` and `games.txt`
            2. Fill in your Steam credentials in `config.json`
            3. Add AppIDs to `games.txt`
            4. Run again — session token is saved for ~30 days

          draft: false
          prerelease: false
          files: artifacts/**/*